<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abuja Jobs Tracker 🇳🇬</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}
body{margin:0;background:#f6f7f9;color:#111}
header{background:#0f172a;color:#fff;padding:20px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:20px;display:block}
.stat span{font-size:12px;color:#666}
.card{background:#fff;border-radius:16px;padding:16px;margin-top:16px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-size:17px;font-weight:700}
.job{background:#f9fafb;border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px}
.job b{font-size:17px}
.del{background:#fee2e2;color:#b91c1c;padding:6px 10px;width:auto;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header><h1 style="margin:0">Abuja Jobs Tracker 🇳🇬</h1><p>Track remote jobs from Abuja • Saved on this device</p></header>
<div class="wrap">
<div class="stats">
<div class="stat"><b id="tTotal">0</b><span>Total</span></div>
<div class="stat"><b id="tApplied">0</b><span>Applied</span></div>
<div class="stat"><b id="tInterview">0</b><span>Interview</span></div>
<div class="stat"><b id="tOffer">0</b><span>Offer</span></div>
</div>
<div class="card">
<h2>+ Add New Job</h2>
<input id="company" placeholder="Company e.g. Test">
<input id="role" placeholder="Role e.g. Test">
<input id="link" placeholder="Job link https://...">
<select id="status"><option>📌 Saved</option><option>✅ Applied</option><option>🎤 Interview</option><option>🎉 Offer</option><option>❌ Rejected</option></select>
<input id="salary" placeholder="Salary e.g. $2,000 / month (optional)">
<input id="deadline" type="date">
<input id="applied" type="date">
<button id="saveBtn">Save Job</button>
</div>
<div id="list"></div>
</div>
<script>
var jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
var company = document.getElementById('company');
var role = document.getElementById('role');
var link = document.getElementById('link');
var statusEl = document.getElementById('status');
var salary = document.getElementById('salary');
var deadline = document.getElementById('deadline');
var applied = document.getElementById('applied');
function render(){
document.getElementById('tTotal').textContent = jobs.length;
document.getElementById('tApplied').textContent = jobs.filter(function(j){return j.status.indexOf('Applied')>-1}).length;
document.getElementById('tInterview').textContent = jobs.filter(function(j){return j.status.indexOf('Interview')>-1}).length;
document.getElementById('tOffer').textContent = jobs.filter(function(j){return j.status.indexOf('Offer')>-1}).length;
var html = '';
jobs.forEach(function(j,i){
html += '<div class="job"><b>'+j.company+' — '+j.role+'</b><br>'+j.status+'<br><button class="del" onclick="delJob('+i+')">Delete</button></div>';
});
document.getElementById('list').innerHTML = html;
}
function delJob(i){ jobs.splice(i,1); localStorage.setItem('jobs', JSON.stringify(jobs)); render(); }
document.getElementById('saveBtn').onclick = function(){
if(!company.value || !role.value){ alert('Type company and role'); return; }
jobs.push({company:company.value, role:role.value, link:link.value, status:statusEl.value, salary:salary.value, deadline:deadline.value, applied:applied.value});
localStorage.setItem('jobs', JSON.stringify(jobs));
company.value=''; role.value=''; link.value=''; salary.value='';
render();
alert('Saved!');
};
render();
</script>
</body>
</html>
