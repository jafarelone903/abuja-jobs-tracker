<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abuja Jobs Tracker 🇳🇬</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,[STRIPPED]">
<style>
*{box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}
body{margin:0;background:#f6f7f9;color:#111}
header{background:#0f172a;color:#fff;padding:20px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:20px;display:block}
.stat span{font-size:12px;color:#666}
.card{background:#fff;border-radius:16px;padding:16px;margin-top:16px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-size:17px;font-weight:700}
.shareBtn{background:#fff;color:#0f172a;margin-top:12px}
.job{background:#f9fafb;border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px}
.job b{font-size:17px}
.job a{color:#2563eb;word-break:break-all}
.del{background:#fee2e2;color:#b91c1c;padding:6px 10px;width:auto;font-size:13px;margin-top:8px}
.small{font-size:13px;color:#555;margin-top:4px}
</style>
</head>
<body>
<header><h1 style="margin:0">Abuja Jobs Tracker 🇳🇬</h1><p>Track remote jobs from Abuja • Saved on this device</p><button class="shareBtn" onclick="shareApp()">📤 Share This App With Friends</button></header>
<div class="wrap">
<div class="stats">
<div class="stat"><b id="tTotal">0</b><span>Total</span></div>
<div class="stat"><b id="tApplied">0</b><span>Applied</span></div>
<div class="stat"><b id="tInterview">0</b><span>Interview</span></div>
<div class="stat"><b id="tOffer">0</b><span>Offer</span></div>
</div>
<div class="card">
<h2>+ Add New Job</h2>
<input id="company" placeholder="Company e.g. Toptal">
<input id="role" placeholder="Role e.g. Frontend Developer">
<input id="link" placeholder="Job link https://...">
<select id="status"><option>📌 Saved</option><option>✅ Applied</option><option>🎤 Interview</option><option>🎉 Offer</option><option>❌ Rejected</option></select>
<input id="salary" placeholder="Salary e.g. $2,000 / month (optional)">
<label style="font-size:13px;color:#666">Deadline</label>
<input id="deadline" type="date">
<label style="font-size:13px;color:#666">Date Applied</label>
<input id="applied" type="date">
<textarea id="notes" placeholder="Notes e.g. Recruiter name, referral, next step"></textarea>
<button id="saveBtn">Save Job</button>
</div>
<div id="list"></div>
</div>
<div style="text-align:center;padding:20px;color:#666;font-size:14px;line-height:1.6">
Made with ❤️ in Abuja by <b>Jafar Muktar Nafiu</b><br>
Founder, Abuja Jobs Tracker 🇳🇬<br>
<a href="https://abuja-jobs-tracker-app.vercel.app" style="color:#2563eb">abuja-jobs-tracker-app.vercel.app</a>
</div>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
function shareApp(){
var text = "I built this app from Abuja 🇳🇬 Try Abuja Jobs Tracker by Jafar Muktar Nafiu - it's FREE: https://abuja-jobs-tracker-app.vercel.app";
if(navigator.share){ navigator.share({title:'Abuja Jobs Tracker by Jafar Muktar Nafiu', text:text, url:'https://abuja-jobs-tracker-app.vercel.app'}); }
else { navigator.clipboard.writeText(text); alert('Link copied! Paste it on WhatsApp'); }
}
var jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
var company = document.getElementById('company');
var role = document.getElementById('role');
var link = document.getElementById('link');
var statusEl = document.getElementById('status');
var salary = document.getElementById('salary');
var deadline = document.getElementById('deadline');
var applied = document.getElementById('applied');
var notes = document.getElementById('notes');
function esc(s){ return (s||'').replace(/</g,'&lt;'); }
function render(){
document.getElementById('tTotal').textContent = jobs.length;
document.getElementById('tApplied').textContent = jobs.filter(function(j){return j.status.indexOf('Applied')>-1}).length;
document.getElementById('tInterview').textContent = jobs.filter(function(j){return j.status.indexOf('Interview')>-1}).length;
document.getElementById('tOffer').textContent = jobs.filter(function(j){return j.status.indexOf('Offer')>-1}).length;
var html = '';
jobs.forEach(function(j,i){
var linkHtml = j.link ? '<div class="small"><a href="'+esc(j.link)+'" target="_blank">🔗 Open Job Link</a></div>' : '';
var salHtml = j.salary ? '<div class="small">💰 '+esc(j.salary)+'</div>' : '';
var deadHtml = j.deadline ? '<div class="small">⏰ Deadline: '+esc(j.deadline)+'</div>' : '';
var appHtml = j.applied ? '<div class="small">📅 Applied: '+esc(j.applied)+'</div>' : '';
var noteHtml = j.notes ? '<div class="small">📝 '+esc(j.notes)+'</div>' : '';
html += '<div class="job"><b>'+esc(j.company)+' — '+esc(j.role)+'</b><br>'+esc(j.status)+linkHtml+salHtml+deadHtml+appHtml+noteHtml+'<br><button class="del" onclick="delJob('+i+')">Delete</button></div>';
});
document.getElementById('list').innerHTML = html;
}
function delJob(i){ jobs.splice(i,1); localStorage.setItem('jobs', JSON.stringify(jobs)); render(); }
document.getElementById('saveBtn').onclick = function(){
if(!company.value || !role.value){ alert('Type company and role'); return; }
jobs.push({company:company.value, role:role.value, link:link.value, status:statusEl.value, salary:salary.value, deadline:deadline.value, applied:applied.value, notes:notes.value});
localStorage.setItem('jobs', JSON.stringify(jobs));
company.value=''; role.value=''; link.value=''; salary.value=''; deadline.value=''; applied.value=''; notes.value='';
render();
alert('Saved!');
};
render();
</script>
</body>
</html>
