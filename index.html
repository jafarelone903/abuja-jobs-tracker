<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abuja Jobs Tracker</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f6f6f6;margin:0;padding:12px}
h1{text-align:center}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{flex:1;padding:12px;border-radius:12px;border:0;font-weight:700;background:#ddd}
.tabs button.active{background:#111;color:#fff}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h3{margin:0 0 6px}
.card p{margin:4px 0;color:#555}
.card a{color:#0b5cff;font-weight:700}
.btn{padding:10px 12px;border:0;border-radius:10px;background:#eee;font-weight:700;margin:4px 4px 0 0}
.btn.primary{background:#111;color:#fff}
.btn.boost{background:#ffe9a8}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.badge{background:#fff3b0;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:700}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>🇳🇬 Abuja Jobs Tracker</h1>
<p style="text-align:center" class="small">Real Abuja jobs. Tap Apply Here to apply.</p>

<div class="tabs">
<button id="tabPublic" class="active" onclick="showTab('public')">🌍 Public Jobs</button>
<button id="tabMine" onclick="showTab('mine')">📌 My Tracker</button>
</div>

<div style="background:#fff;padding:12px;border-radius:12px">
<b>🔍 AI Match - What can you do?</b>
<input id="skillInput" placeholder="e.g. cooking, HR, canva, driving...">
<button class="btn primary" onclick="doMatch()">Find My Match</button>
<p id="matchResult" class="small"></p>
</div>

<div id="publicView"></div>

<div id="mineView" style="display:none">
<div style="background:#fff;padding:12px;border-radius:12px;margin-top:10px">
<h3>Add Job To My Tracker</h3>
<input id="company" placeholder="Company e.g. Abuja company">
<input id="role" placeholder="Role e.g. HR Generalist">
<input id="salary" placeholder="Salary e.g. 300000">
<input id="deadline" type="date">
<input id="link" placeholder="Job link https://...">
<textarea id="skills" placeholder="Skills / Notes"></textarea>
<button class="btn primary" onclick="addMyJob()">+ Save To My Tracker</button>
</div>
<div id="mineList"></div>
</div>

<div style="background:#fff;padding:14px;border-radius:12px;margin-top:14px">
<h3>🚀 Boost Your Job - ₦5,000 / 7 days</h3>
<p class="small">Employers: your job goes to TOP for everyone.</p>
<input id="boostEmail" placeholder="Your email for receipt">
<button class="btn boost" onclick="payBoost()">Pay ₦5,000 with Paystack</button>
<p class="small">After payment, WhatsApp us your job + receipt.</p>
<a href="https://wa.me/2347043444378?text=Hi%20I%20paid%20for%20Boost" target="_blank"><button class="btn" style="background:#25D366;color:#fff">📲 WhatsApp Us</button></a>
</div>

<script>
const PAYSTACK_KEY = " pk_live_df6ba825b71fcbf594d7f97de3dca530d911f050"; // <-- put your pk_live_... here
let publicJobs = [];
let myJobs = JSON.parse(localStorage.getItem('myJobs') || '[]');
let currentTab = 'public';

async function loadPublic(){
  try{
    const r = await fetch('jobs.json?v=' + Date.now());
    publicJobs = await r.json();
  }catch(e){ publicJobs = []; }
  renderPublic();
  renderMine();
}
function showTab(t){
  currentTab = t;
  document.getElementById('tabPublic').className = t=='public'?'active':'';
  document.getElementById('tabMine').className = t=='mine'?'active':'';
  document.getElementById('publicView').style.display = t=='public'?'block':'none';
  document.getElementById('mineView').style.display = t=='mine'?'block':'none';
}
function money(n){ return '₦' + Number(n||0).toLocaleString(); }
function renderPublic(){
  let h = '<h2>🌍 Jobs Everyone Can See ('+publicJobs.length+')</h2>';
  if(!publicJobs.length) h += '<p class="small">No public jobs yet. Check back soon.</p>';
  publicJobs.forEach(j=>{
    h += `<div class="card">
    ${j.boosted?'<span class="badge">🔥 BOOSTED • TOP JOB</span><br>':''}
    <h3>${j.company} - ${j.role}</h3>
    <p>📌 ${money(j.salary)} • Deadline: ${j.deadline||''}</p>
    <p>${j.skills||''}</p>
    ${j.link?`<a href="${j.link}" target="_blank">🔗 Apply Here</a><br>`:''}
    <button class="btn primary" onclick="saveToMine(${j.id})">+ Save To My Tracker</button>
    <button class="btn" onclick="shareJob(${j.id})">📤 Share to WhatsApp</button>
    </div>`;
  });
  document.getElementById('publicView').innerHTML = h;
}
function renderMine(){
  let h = '<h2>📌 My Tracker ('+myJobs.length+')</h2>';
  myJobs.forEach((j,i)=>{
    h += `<div class="card">
    <h3>${j.company} - ${j.role}</h3>
    <p>${j.status||'Saved'} • ${money(j.salary)} • Deadline: ${j.deadline||''}</p>
    <p>${j.skills||''}</p>
    ${j.link?`<a href="${j.link}" target="_blank">🔗 Apply Here</a><br>`:''}
    <select onchange="changeStatus(${i},this.value)">
    <option ${j.status=='Saved'?'selected':''}>Saved</option>
    <option ${j.status=='Applied'?'selected':''}>Applied</option>
    <option ${j.status=='Interview'?'selected':''}>Interview</option>
    <option ${j.status=='Rejected'?'selected':''}>Rejected</option>
    </select>
    <button class="btn" onclick="deleteMine(${i})">Delete</button>
    </div>`;
  });
  document.getElementById('mineList').innerHTML = h;
}
function saveToMine(id){
  let j = publicJobs.find(x=>x.id==id);
  if(!j) return;
  myJobs.push({...j, status:'Saved'});
  localStorage.setItem('myJobs', JSON.stringify(myJobs));
  alert('Saved to My Tracker! Go to 📌 My Tracker tab.');
  renderMine();
}
function addMyJob(){
  let j = {id:Date.now(), company:company.value, role:role.value, salary:salary.value, deadline:deadline.value, link:link.value, skills:skills.value, status:'Saved'};
  if(!j.company||!j.role) return alert('Add Company + Role');
  myJobs.push(j); localStorage.setItem('myJobs', JSON.stringify(myJobs));
  renderMine(); alert('Saved!');
}
function changeStatus(i,v){ myJobs[i].status=v; localStorage.setItem('myJobs', JSON.stringify(myJobs)); renderMine(); }
function deleteMine(i){ if(confirm('Delete?')){ myJobs.splice(i,1); localStorage.setItem('myJobs', JSON.stringify(myJobs)); renderMine(); } }
function shareJob(id){
  let j = publicJobs.find(x=>x.id==id);
  let txt = `Abuja Job: ${j.company} - ${j.role} - ${money(j.salary)}\nApply: ${j.link}\nVia Abuja Jobs Tracker: ${location.href}`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt));
}
function doMatch(){
  let q = skillInput.value.toLowerCase().trim();
  if(!q) return matchResult.innerText='Type a skill first e.g. cooking';
  let best=null,score=0;
  publicJobs.forEach(j=>{
    let text=(j.role+' '+j.skills).toLowerCase();
    let s=0; q.split(' ').forEach(w=>{ if(w.length>2 && text.includes(w)) s++; });
    if(s>score){score=s;best=j;}
  });
  matchResult.innerText = best ? `✅ Best Match: ${best.company} - ${best.role} (${money(best.salary)}) - Tap Apply Here` : 'No match yet. Try cooking / HR / canva / driving';
}
function payBoost(){
  let email = document.getElementById('boostEmail').value;
  if(!email) return alert('Enter your email first');
  if(!PAYSTACK_KEY.includes('pk_live_')) return alert('Paystack key not set. Put your pk_live_ key in code.');
  let h = PaystackPop.setup({key:PAYSTACK_KEY, email:email, amount:500000, currency:'NGN', ref:''+Math.floor(Math.random()*1000000000), onClose:()=>alert('Payment closed'), callback:(r)=>alert('Payment successful! Ref: '+r.reference+' - WhatsApp us your job + receipt.')});
  h.openIframe();
}
loadPublic();
</script>
</body>
</html>
